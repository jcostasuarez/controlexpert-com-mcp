name: Release

# Two ways to publish a release. Either one needs the version in Cargo.toml
# and a section for it in CHANGELOG.md.
# - Run this workflow on main from the Actions tab (or the API). It creates the
#   tag v<version> on that commit. With dry_run it builds and uploads the zip
#   as a workflow artifact without creating a tag or a release.
# - Push a tag such as v0.2.0; it must match the version in Cargo.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only; do not create the tag or the release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_TOOLCHAIN: "1.99"

jobs:
  release:
    name: build and publish (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Check the version, the tag and CHANGELOG.md
        id: meta
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $tag = "v$version"
          if ("${{ github.event_name }}" -eq "push") {
            if ("${{ github.ref_name }}" -ne $tag) { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version" }
          } elseif ($env:DRY_RUN -ne "true") {
            if ("${{ github.ref }}" -ne "refs/heads/main") { throw "Releases are published from main, not ${{ github.ref }}" }
            if (git ls-remote --tags origin "refs/tags/$tag") { throw "Tag $tag already exists; bump the version in Cargo.toml" }
          }
          $notes = [System.Collections.Generic.List[string]]::new()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## \[') {
              if ($inside) { break }
              $inside = $line -match "^## \[$([regex]::Escape($version))\]"
              continue
            }
            # Skip the link reference definitions at the end of the file.
            if ($inside -and $line -notmatch '^\[[^\]]+\]: ') { $notes.Add($line) }
          }
          if (-not $inside) { throw "CHANGELOG.md has no section for $version" }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8 release-notes.md
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - run: cargo test --locked --all-targets

      - name: Build
        # Static CRT: the executable does not need the Visual C++ runtime.
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
        run: cargo build --locked --release

      - name: Package
        id: package
        run: |
          $name = "controlexpert-com-mcp-v${{ steps.meta.outputs.version }}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/controlexpert-com-mcp.exe, README.md, CHANGELOG.md, LICENSE, mcp.json, codex-mcp.toml $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload the package (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.name }}.zip.sha256
            release-notes.md

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        # On a manual run the release creates the tag on this commit. A tag
        # created with the workflow token does not start this workflow again.
        run: |
          $name = "${{ steps.package.outputs.name }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          gh release create $tag "$name.zip" "$name.zip.sha256" `
            --target "${{ github.sha }}" --title $tag --notes-file release-notes.md
