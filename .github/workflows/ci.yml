name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Pinned so a new Rust release cannot turn CI red with new lints.
  # Bump it on purpose, together with the fixes it asks for. Keep it in
  # sync with release.yml.
  RUST_TOOLCHAIN: "1.99"

jobs:
  check:
    name: fmt, clippy and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Includes the COM marshalling and policy tests, which use local
      # IDispatch fixtures and need no Control Expert installation.
      - run: cargo test --locked --all-targets

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
